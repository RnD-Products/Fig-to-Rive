<!doctype html>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; --bg:#1e1e1e; --panel:#2a2a2a; --panel2:#262626; --line:#3d3d3d; --text:#e8e8e8; --muted:#9b9b9b; --accent:#0d99ff;
    --code:#383838; --err:#f87171; --warn:#fbbf24; --ok:#4ade80; --info:#60a5fa; --fixbg:#12372a; --fixfg:#86efac; --chip:#27304d; --chipline:#3b4a7a; --chiptext:#c7d2fe; }
  html, body { background: var(--bg); }
  body { font: 12px/1.5 Inter, system-ui, sans-serif; margin: 0; padding: 0 16px 20px; color: var(--text); }
  h1 { font-size: 14px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--muted); }
  p b, p code { color: var(--text); }
  a { color: var(--accent); }
  button { font: inherit; font-weight: 500; padding: 8px 14px; border-radius: 6px; border: 0; background: var(--accent); color: #fff; cursor: pointer; margin-right: 6px; transition: filter .12s, background .12s; }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:hover { filter: brightness(1.1); }
  button.alt { background: #3a3a3a; color: var(--text); }
  button[disabled] { opacity: .4; cursor: not-allowed; filter: none; }
  input { font: inherit; width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); color: var(--text); outline: none; }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: #6f6f6f; }
  .box { margin-top: 12px; padding: 10px; border-radius: 6px; background: var(--panel); color: var(--text); }
  /* colour only as a thin marker, never as text */
  .box.ok { border-left: 3px solid var(--ok); } .box.warn { border-left: 3px solid var(--warn); } .box.bad { border-left: 3px solid var(--err); } .box.info { border-left: 3px solid var(--info); }
  .box.warn li, .box.info li { color: #cfcfcf; }
  code { background: var(--code); color: var(--text); padding: 1px 4px; border-radius: 3px; }
  ul { margin: 4px 0 0 16px; padding: 0; } pre { white-space: pre-wrap; margin: 6px 0 0; font-size: 11px; max-height: 120px; overflow: auto; color: var(--text); }
  label { display: block; margin: 8px 0 4px; color: var(--muted); }
  label.chk { display: flex; gap: 8px; align-items: flex-start; color: var(--text); margin: 6px 0; }
  label.chk input { width: auto; margin-top: 2px; accent-color: var(--accent); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 -16px 14px; padding: 6px 16px 0; position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .tab { background: none; color: var(--muted); border-radius: 6px 6px 0 0; padding: 8px 12px; margin: 0; }
  .tab:hover { color: var(--text); filter: none; }
  .tab.on { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); font-weight: 600; }
  .score { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 8px; background: var(--panel); }
  .score b.n { font-size: 26px; line-height: 1; color: var(--text); }
  .pill { display: inline-block; padding: 1px 8px 1px 6px; border-radius: 10px; font-size: 11px; margin-right: 4px; color: #cfcfcf; background: #363636; }
  .pill::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .pill.error::before { background: #ef4444; } .pill.warning::before { background: #f59e0b; } .pill.info::before { background: #3b82f6; }
  .issue { border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 10px; margin-top: 8px; }
  .issue.error { border-left: 4px solid #ef4444; } .issue.warning { border-left: 4px solid #f59e0b; } .issue.info { border-left: 4px solid #3b82f6; }
  .issue h3 { font-size: 12px; margin: 0 0 4px; color: var(--text); }
  .issue .fix { margin-top: 6px; padding: 6px 8px; background: #323232; border-radius: 6px; color: var(--text); }
  .issue .why { color: #b5b5b5; }
  button.sm { padding: 3px 8px; font-size: 11px; margin: 6px 6px 0 0; }
  .muted { color: var(--muted); }
  .layers { margin-top: 8px; }
  .layers .row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { background: #333; color: #ddd; border: 1px solid #4a4a4a; border-radius: 12px; padding: 2px 9px; font-size: 11px; margin: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip:hover { background: #3f3f3f; } .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .linkbtn { background: none; color: var(--accent); padding: 2px 4px; margin: 4px 0 0; font-size: 11px; }
  .more[hidden] { display: none; }
  .tabs .gear { margin: 0 0 0 auto; padding: 6px 8px; background: none; color: var(--muted); font-size: 16px; line-height: 1; border-radius: 6px; }
  .tabs .gear:hover, .tabs .gear.on { color: var(--accent); filter: none; }
  #settings { margin: 0 0 12px; padding: 10px; border-radius: 8px; background: var(--panel); }
  #settings[hidden] { display: none; }
  #settings label { margin-top: 0; }
  #tokenNote { margin-top: 6px; min-height: 14px; }
  .sec { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
  .field { margin-bottom: 2px; } .field label { margin: 0 0 4px; } .hint { margin: 4px 0 0; font-size: 11px; color: var(--muted); }
  details.opts { margin-top: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); }
  details.opts summary { cursor: pointer; padding: 9px 10px; color: var(--text); font-weight: 500; list-style: none; display: flex; align-items: center; gap: 6px; }
  details.opts summary::-webkit-details-marker { display: none; }
  details.opts summary::before { content: '\25B8'; color: var(--muted); transition: transform .12s; }
  details.opts[open] summary::before { transform: rotate(90deg); }
  details.opts .body { padding: 0 10px 6px; border-top: 1px solid var(--line); }
  .actions { display: flex; gap: 8px; margin-top: 16px; } .actions button { margin: 0; flex: 1; padding: 10px 14px; } .actions button.alt { flex: 0 0 auto; }
  input:disabled { opacity: .5; }
  select { font: inherit; width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); color: var(--text); outline: none; }
  select:focus { border-color: var(--accent); }
  .recent { border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
  .recent .rtop { display: flex; justify-content: space-between; gap: 8px; } .recent .rtop b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rhead { display: flex; align-items: center; justify-content: space-between; }
  .iconbtn { margin: 0; padding: 3px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; background: none; color: var(--muted); border-radius: 6px; }
  .iconbtn:hover { color: var(--text); background: #333; filter: none; }
  .iconbtn.spin svg { animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  .recent { position: relative; }
  .recent .trash { position: absolute; right: 6px; bottom: 6px; margin: 0; padding: 4px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: none; color: var(--muted); border-radius: 6px; opacity: 0; transition: opacity .12s, color .12s, background .12s; }
  .recent:hover .trash, .recent .trash:focus-visible { opacity: 1; } .recent .trash:hover { color: var(--err); background: #3a3a3a; filter: none; }
  .rtabs { display: flex; gap: 4px; padding: 2px; border-radius: 8px; background: var(--panel); width: fit-content; }
  .rtab { margin: 0; padding: 4px 12px; border-radius: 6px; background: none; color: var(--muted); font-size: 11px; } .rtab:hover { color: var(--text); filter: none; } .rtab.on { background: #3a3a3a; color: var(--text); }
  .recent .rbtns { padding-right: 28px; }
  .recent .rbtns { display: flex; gap: 6px; flex-wrap: wrap; } .recent .rbtns button { margin: 6px 0 0; } .recent a { text-decoration: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b6b6b; align-self: center; margin-left: auto; margin-right: 2px; flex: none; }
  .dot + .gear { margin-left: 0; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--err); } .dot.off { background: #6b6b6b; }
  .score b.n { min-width: 44px; text-align: center; }
  .score .sub { margin-top: 4px; }
  .issue { padding: 0; }
  .ihead { display: flex; align-items: center; gap: 8px; width: 100%; margin: 0; padding: 10px; background: none; color: var(--text); text-align: left; border-radius: 8px; font-weight: 600; }
  .ihead:hover { background: #2f2f2f; filter: none; }
  .ihead .ititle { flex: 1; min-width: 0; }
  .ihead .chev { width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); transition: transform .12s; flex: none; margin-right: 2px; }
  .cardbody { padding: 10px; }
  .issue.open .chev { transform: rotate(45deg); }
  .ibody { padding: 0 10px 10px; } .ibody[hidden] { display: none; }
  .issue .why { margin-top: 2px; }
  .head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; } .head-actions button { margin: 0; }
  .group-title { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 18px 0 0; }
  .empty { padding: 14px; border-radius: 8px; background: var(--panel); text-align: center; color: var(--text); margin-top: 12px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #444; border-radius: 5px; border: 2px solid var(--bg); } ::-webkit-scrollbar-track { background: var(--bg); }
</style>
<div class="tabs">
  <button class="tab on" id="tabImport">Import</button>
  <button class="tab" id="tabAnalysis">Design analysis</button>
  <button class="tab" id="tabClean">Clean</button>
  <span class="dot off" id="dot" title="Helper: checking"></span>
  <button class="gear" id="gear" title="Settings" aria-label="Settings">&#9881;</button>
</div>
<div id="settings" hidden>
  <label for="token">Helper token</label>
  <input id="token" placeholder="Paste, then press Enter" autocomplete="off" spellcheck="false">
  <div class="muted" id="tokenNote"></div>
  <div class="muted" id="helperState" style="margin-top:6px"></div>
</div>
<div id="paneClean" hidden>
  <div class="muted" id="cleanSel" style="margin-bottom:8px">Select layers or frames to clean.</div>
  <div class="issue info"><div class="cardbody">
    <div class="sec" style="margin-top:0">Names</div>
    <label class="chk"><input type="checkbox" id="cnSpaces" checked><span>Trim and collapse extra spaces</span></label>
    <label class="chk"><input type="checkbox" id="cnSymbols" checked><span>Remove emoji and hidden characters</span></label>
    <label class="chk" title='Turns names like "Frame 2147230678" or "Vector 9323" into "Frame" or "Vector".'><input type="checkbox" id="cnGeneric" checked><span>Simplify default names (Frame 123 &rarr; Frame)</span></label>
    <div class="muted" id="cnInfo" style="margin:6px 0 8px"></div>
    <button id="cnApply">Clean names</button>
  </div></div>
  <div class="issue info" style="margin-top:12px"><div class="cardbody">
    <div class="sec" style="margin-top:0">Pixels</div>
    <label class="chk" title="Rounds x and y to whole numbers. Skips rotated and flipped layers and layers placed by auto layout."><input type="checkbox" id="cpPos" checked><span>Snap positions to whole pixels</span></label>
    <label class="chk" title="Rounds width and height. Skips text, lines, and sizes set to hug or fill."><input type="checkbox" id="cpSize" checked><span>Snap sizes to whole pixels</span></label>
    <div class="muted" id="cpInfo" style="margin:6px 0 8px"></div>
    <button id="cpApply">Snap to pixels</button>
  </div></div>
  <div class="issue info" style="margin-top:12px"><div class="cardbody">
    <div class="sec" style="margin-top:0">Hidden</div>
    <label class="chk" title="Deletes layers whose eye is switched off. They are not imported into Rive anyway. Layers inside instances are skipped."><input type="checkbox" id="chLayers" checked><span>Delete hidden layers</span></label>
    <label class="chk" title="Removes fills, strokes, shadows and blurs that are switched off or at 0% opacity."><input type="checkbox" id="chPaints" checked><span>Remove hidden fills, strokes and effects</span></label>
    <div class="muted" id="chInfo" style="margin:6px 0 8px"></div>
    <button id="chApply">Remove hidden</button>
  </div></div>
  <label class="chk" style="margin-top:12px"><input type="checkbox" id="cDeep" checked><span>Include everything inside the selection</span></label>
  <div id="cleanOut"></div>
</div>
<div id="paneAnalysis" hidden>
  <div class="head-actions"><button id="runAnalysis">Analyse selection</button><button id="sendClaude" class="alt" title="Saves the report, previews and design data in the helper's claude-inbox folder">Send to Claude</button>
  <span class="muted" id="selInfo"></span></div>
  <div id="analysisOut"></div>
</div>
<div id="paneImport">
<div class="box" id="detected" style="margin-top:0">Select a frame to begin.</div>

<div class="sec">File name</div>
<input id="projname" placeholder="From the selected frame">

<div class="sec">Destination</div>
<div class="rtabs" id="destTabs"><button class="rtab on" data-dest="account">My account</button><button class="rtab" data-dest="open">Open Rive file</button></div>
<div class="field" id="linkWrap" hidden style="margin-top:8px">
  <input id="filelink" placeholder="Paste the file's link or id" aria-label="Open Rive file link">
</div>
<div class="field" id="addWrap" hidden style="margin-top:8px"><select id="addTo" aria-label="Add to project"></select></div>
<div class="hint" id="destHint"></div>

<details class="opts">
  <summary>Options</summary>
  <div class="body">
    <label class="chk" title="Size, fill and layout of the frame become the artboard's. Off: the frame is a layout box inside a plain artboard."><input type="checkbox" id="optArtboard" checked><span>Frame becomes the artboard</span></label>
    <label class="chk" title="Each main component becomes its own Rive component artboard."><input type="checkbox" id="optComp" checked><span>Components as artboards</span></label>
    <label class="chk" title="Instances become live nested artboards of their component. Needs Components on. Off: plain layout."><input type="checkbox" id="optLink" checked><span>Link instances to components</span></label>
    <label class="chk" title="Inner shadows also cover the layers inside, like Figma."><input type="checkbox" id="optInner" checked><span>Inner shadows over contents</span></label>
    <label class="chk" title="Rewrites the layout so the file draws the same in the runtime you pick below, not only in the Rive editor. Off: the normal Rive output."><input type="checkbox" id="optSafe"><span>Safe layout</span></label>
    <div id="safeTargets" style="display:none;margin:2px 0 6px 22px;font-size:11px;color:var(--muted,#888)">
      <label style="margin-right:12px" title="Rive element in Webflow (runtime 2.35): no layout boxes in Nodes, rotations and flips baked into shapes, fixed text boxes, no hue or additive blends."><input type="radio" name="safeTarget" id="tgtWebflow" value="webflow" checked> Webflow</label>
      <label style="opacity:.5;cursor:not-allowed" title="Locked: Framer is not supported yet."><input type="radio" name="safeTarget" id="tgtFramer" value="framer" disabled> Framer &#128274;</label>
    </div>
    <label class="chk" title="Open Rive file only. The old artboard is swapped for the new one, even after a rename. Edits you made to it in Rive are lost (a backup is saved). Off: saves a new artboard."><input type="checkbox" id="optReplace" checked><span>Update replaces the artboard</span></label>
    <label class="chk" title="Pushes as soon as the export verifies. Updates still wait for you."><input type="checkbox" id="optAuto"><span>Push automatically</span></label>
  </div>
</details>

<div class="actions">
  <button id="send">Send to Rive</button><button id="zip" class="alt" title="Download the converted files without the helper">Zip</button>
</div>

<div id="out"></div>
<div id="recents"></div>
</div>
<script>/* Figma snapshot -> Rive RML.
 *
 * Pure function, no Figma API: it takes the plain-JSON snapshot that code.js
 * extracts, so the same file runs inside the plugin UI and in Node for tests.
 *
 * The two rules this plugin exists for:
 *   1. Auto layout is never flattened. An auto layout frame becomes a
 *      LayoutComponent (+ LayoutComponentStyle); children that sit in the flow
 *      get a LayoutParticipant. Gap, padding, alignment, wrap, hug/fill/fixed and
 *      absolute positioning all carry over as layout properties.
 *   2. Text is never outlined. A TEXT node always becomes Text + TextStylePaint +
 *      TextValueRun, and the font it needs is reported, never baked into paths.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.FigmaToRive = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // Figma keeps the layers inside a group positioned relative to the group's PARENT frame, not to the group.
  // Rive groups are their own space, so move each group's children into group-local coordinates first.
  function mulT(A, B) {
    return [[A[0][0] * B[0][0] + A[0][1] * B[1][0], A[0][0] * B[0][1] + A[0][1] * B[1][1], A[0][0] * B[0][2] + A[0][1] * B[1][2] + A[0][2]],
      [A[1][0] * B[0][0] + A[1][1] * B[1][0], A[1][0] * B[0][1] + A[1][1] * B[1][1], A[1][0] * B[0][2] + A[1][1] * B[1][2] + A[1][2]]];
  }
  function invT(T) {
    var a = T[0][0], c = T[0][1], tx = T[0][2], b = T[1][0], d = T[1][1], ty = T[1][2], det = a * d - c * b;
    if (Math.abs(det) < 1e-9) return null;
    return [[d / det, -c / det, (c * ty - d * tx) / det], [-b / det, a / det, (b * tx - a * ty) / det]];
  }
  function rebaseGroups(node) {
    var T = node.relativeTransform, out = Object.assign({}, node);
    if (node.children) {
      out.children = node.children.map(function (c) {
        var cT = c.relativeTransform, kid = rebaseGroups(c), inv = (node.type === 'GROUP' && T && cT) ? invT(T) : null;
        if (inv) { var m = mulT(inv, cT); kid.relativeTransform = m; kid.x = m[0][2]; kid.y = m[1][2]; }
        return kid;
      });
    }
    return out;
  }

  function convert(snapshot, options) {
    snapshot = Object.assign({}, snapshot, { nodes: (snapshot.nodes || []).map(rebaseGroups), components: (snapshot.components || []).map(rebaseGroups) });
    options = options || {};
    var warnings = [];
    var fonts = {}; // key -> {family, style, file, assetId}
    var nextId = 100;
    var fontAssetIds = {};
    var imageAssets = {};   // hash -> {file, id, hash, ext}
    var notes = [];
    var detached = 0;
    var seenWarn = {};
    var frameAsLayout = options.frameMode === 'layout';
    var componentArtboards = options.componentArtboards !== false;

    function id() { return '0:' + nextId++; }
    function warn(node, msg) {
      var k = msg + '|' + (node && node.type);
      var line = (node ? '"' + node.name + '" (' + node.type + '): ' : '') + msg;
      if (seenWarn[line]) return;
      seenWarn[line] = true;
      warnings.push(line);
    }
    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/\r?\n/g, '&#10;');
    }
    function num(v) { return String(Math.round(v * 1000) / 1000); }
    function attr(name, v) { return v === undefined || v === null ? '' : ' ' + name + '="' + esc(v) + '"'; }

    // ---- colour -------------------------------------------------------
    function hex2(v) { var s = Math.max(0, Math.min(255, Math.round(v * 255))).toString(16); return s.length < 2 ? '0' + s : s; }
    function colorHex(c, opacity) {
      var a = (c.a === undefined ? 1 : c.a) * (opacity === undefined ? 1 : opacity);
      return (hex2(a) + hex2(c.r) + hex2(c.g) + hex2(c.b)).toUpperCase();
    }

    // ---- paint --------------------------------------------------------
    function invert(t) { // 2x3 affine [[a,c,e],[b,d,f]]
      var a = t[0][0], c = t[0][1], e = t[0][2], b = t[1][0], d = t[1][1], f = t[1][2];
      var det = a * d - b * c;
      if (!det) return [[1, 0, 0], [0, 1, 0]];
      return [[d / det, -c / det, (c * f - d * e) / det], [-b / det, a / det, (b * e - a * f) / det]];
    }
    function apply(t, x, y) { return [t[0][0] * x + t[0][1] * y + t[0][2], t[1][0] * x + t[1][1] * y + t[1][2]]; }

    // centered: the paint belongs to a Shape, whose local origin is its centre. A layout box (and the artboard) measures from its top-left.
    function paintBody(paint, node, w, h, extraOpacity, centered) {
      var gx = centered ? w / 2 : 0, gy = centered ? h / 2 : 0;
      var op = (paint.opacity === undefined ? 1 : paint.opacity) * (extraOpacity === undefined ? 1 : extraOpacity);

        var stops = paint.gradientStops.map(function (st) {
          return '<GradientStop colorValue="' + colorHex(st.color, op) + '" position="' + num(st.position) + '"/>';
        }).join('');
        return '<LinearGradient startX="' + num(s[0] * w - gx) + '" startY="' + num(s[1] * h - gy) + '" endX="' + num(e[0] * w - gx) +
          '" endY="' + num(e[1] * h - gy) + '" name="Gradient">' + stops + '</LinearGradient>';
      }
      if (paint.type === 'GRADIENT_RADIAL' && paint.gradientTransform && paint.gradientStops) {
        // Figma's gradient space has the centre at (0.5,0.5) and the radius running to (1,0.5).
        var invR = invert(paint.gradientTransform);
        var c0 = apply(invR, 0.5, 0.5), c1 = apply(invR, 1, 0.5), c2 = apply(invR, 0.5, 1);
        var rx = Math.hypot((c1[0] - c0[0]) * w, (c1[1] - c0[1]) * h), ry = Math.hypot((c2[0] - c0[0]) * w, (c2[1] - c0[1]) * h);
        if (Math.abs(rx - ry) > Math.max(rx, ry) * 0.12) warn(node, 'elliptical radial gradient imported as a circular one');
        var rstops = paint.gradientStops.map(function (st) {
          return '<GradientStop colorValue="' + colorHex(st.color, op) + '" position="' + num(st.position) + '"/>';

    document.getElementById('chInfo').innerHTML = m.empty ? '' : (hc ? '<b>' + m.hidden.layers + '</b> hidden layer' + (m.hidden.layers === 1 ? '' : 's') + ', <b>' + m.hidden.paints + '</b> hidden fill/stroke/effect' + (m.hidden.paints === 1 ? '' : 's') + ex(m.hidden.examples) : 'Nothing hidden to remove.');

    document.getElementById('cnApply').disabled = m.empty || !m.names.count; document.getElementById('cpApply').disabled = m.empty || !m.pixels.count;
    return;
  }
  if (m.type === 'cleanDone') {
    document.getElementById('cleanOut').innerHTML = '<div class="box ok"><b>' + (m.which === 'names' ? 'Renamed ' : m.which === 'hidden' ? 'Removed ' : 'Snapped ') + m.done + (m.which === 'hidden' ? ' hidden item' : ' layer') + (m.done === 1 ? '' : 's') + '.</b><br><span class="muted">Press Cmd+Z in Figma to undo.</span></div>';

  }

    if (!paneAnalysis.hidden) { clearTimeout(analysisTimer); analysisTimer = setTimeout(runAnalysis, 400); }
    return;
  }
  if (m.type === 'names') {
    var changed = false;
    recents.forEach(function (x) { if (x.fb) return; (x.ids || []).forEach(function (id, k) { var nm = m.map[id]; if (nm != null && x.frames && x.frames[k] !== nm) { x.frames[k] = nm; changed = true; } }); });

    return;
  }
  if (m.type === 'settings' && refreshing) { var wait = Math.max(0, 800 - (Date.now() - refreshing)); refreshing = false; recents = m.recents || recents; snaps = m.snaps || snaps; delAsk = null; setTimeout(function () { renderRecents(); resolveNames(); syncAccount(); }, wait); return; }
  if (m.type === 'settings') { tokenEl.value = m.token; if (!m.token) toggleSettings(true); checkHelper(); links = m.links || {}; recents = m.recents || []; snaps = m.snaps || {}; dests = m.dests || {}; var sf = m.selection && m.selection.file; if (m.fileLink && sf && !links[sf]) links[sf] = m.fileLink; renderRecents(); resolveNames(); syncAccount(); if (m.opts) { optArt.checked = m.opts.artboard !== false; optComp.checked = m.opts.comp !== false; optInner.checked = m.opts.inner !== false; optAuto.checked = m.opts.autoPush === true; optReplace.checked = m.opts.replace !== false; optLink.checked = m.opts.link !== false; optSafe.checked = m.opts.safe === true || m.opts.webflow === true; syncSafe(); } showSelection(m.selection); return; }
  if (m.type === 'error') { artTarget = null; forceReplace = false; viaUpdate = false; if (resendPrev !== null) { linkEl.value = resendPrev; resendPrev = null; }
    out.innerHTML = '<div class="box bad">' + esc(m.message) + '</div>'; return; }
  if (m.type !== 'snapshot') return;
  var name = projectName(m, 'figma-import');
  var res = FigmaToRive.convert({ nodes: m.nodes, components: m.components, images: m.images }, { name: name, frameMode: optArt.checked ? 'artboard' : 'layout', componentArtboards: optComp.checked, linkComponents: optLink.checked, innerShadowOverChildren: optInner.checked });

  last = { name: name, bytes: m.imageBytes || {} };
  if (mode === 'zip') { out.innerHTML = '<div class="box ok">Converted ' + m.nodes.length + ' frame(s).</div>' + notesHtml(res) + warningsHtml(res) + zipHtml(res, name); return; }
  if (m.fileName) curFile = curFile || m.fileName;
  var fileId = ((linkEl.value.match(/file\/[^\/]+\/(\d+)/) || linkEl.value.match(/^\s*(\d+)\s*$/) || [])[1]) || '';
  var linkUsed = linkEl.value; // what this send really uses (Update may differ from the field)
  if (resendPrev !== null) { linkEl.value = resendPrev; resendPrev = null; } else linkChanged(); // Update must not change the remembered link
  if (linkUsed.trim() && !fileId) { out.innerHTML = '<div class="box bad">I could not find a file id in that link. It should look like https://editor.rive.app/file/name/1234567</div>'; return; }
  var curSnap = flatten(m.nodes), wasUpdate = viaUpdate, target = artTarget, forced = forceReplace; viaUpdate = false; artTarget = null; forceReplace = false;
  var selIds = (m.nodes || []).map(function (n) { return n.id; }), frameNames = (m.nodes || []).map(function (n) { return n.name; });
  var replacePairs = [];
  if (fileId && (optReplace.checked || forced)) {
    var pmapOf = function (key) { return (snaps[key] || {}).map || {}; };
    var pmap = {}; [snaps['file-' + fileId] && 'file-' + fileId, target && target.name].forEach(function (k) { if (k) { var mp = pmapOf(k); for (var id in mp) if (!pmap[id]) pmap[id] = mp[id]; } });
    (m.nodes || []).forEach(function (n) { var nw = String(n.name).trim(); replacePairs.push({ old: pmap[n.id] ? String(pmap[n.id][0]).trim() : nw, new: nw }); });
    (res.componentNames || []).forEach(function (nm) { replacePairs.push({ old: nm, new: nm }); });
  }
  function runExport() {
  out.innerHTML = '<div class="box">Sending to the helper…</div>';
  return call('/export', { name: name, rml: res.rml, yaml: res.yaml, fonts: res.fonts, fileId: fileId, replace: replacePairs, images: res.images.map(function (im) { return { file: im.file, base64: toB64(last.bytes[im.hash]) }; }) }).then(function (r) {
    var ok = r.verify.ok, f = r.fonts, html = '<div class="box ' + (ok ? 'ok' : 'bad') + '"><b>' + (ok ? 'Built and verified' : 'rive found errors') + '</b>' +
      (r.mode === 'existing' ? '<br>' + (r.replaced && r.replaced.length ? 'Replaced: <b>' + r.replaced.map(esc).join(', ') + '</b><br>' : '') + 'Now in the file: <b>' + (r.added || []).map(esc).join(', ') + '</b>' : '') + (ok ? '' : '<pre>' + esc(r.verify.output) + '</pre>') + '</div>';
    if (f.standIn.length) html += '<div class="box warn"><b>Stand-in fonts used</b><ul>' + f.standIn.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>Add them to <code>Fonts Library/</code> and send again.</div>';
    if (f.missing.length) html += '<div class="box bad"><b>Missing fonts</b>: ' + f.missing.map(esc).join(', ') + '</div>';
    html += notesHtml(res) + warningsHtml(res);
    var prevSnap = snaps[r.name], changes = ok && prevSnap ? changesHtml(diffSnaps(prevSnap.map, curSnap), prevSnap.time) : (ok && wasUpdate ? '<div class="box info">No earlier record to compare. Changes show from the next update.</div>' : '');
    if (ok) { snaps[r.name] = { time: Date.now(), map: curSnap }; var keep = Object.keys(snaps).sort(function (a, b) { return snaps[b].time - snaps[a].time; }); keep.slice(5).forEach(function (k) { delete snaps[k]; }); }

    out.innerHTML = banner + changes + html + zipHtml(res, name);
    var fileUrl = r.mode === 'existing' ? 'https://editor.rive.app/file/' + r.fileId : '';
    var prev = recents.filter(function (x) { return x.name === r.name; })[0];
    if (target) { mergeFrames(target.name, selIds, frameNames); patchRecent(target.name, { time: Date.now() }); } else addRecent({ name: r.name, mode: r.mode === 'existing' ? 'existing' : 'new', time: Date.now(), ids: selIds, frames: frameNames, link: r.mode === 'existing' ? String(r.fileId) : '', url: fileUrl || (prev && prev.url) || '', pushed: !!(prev && prev.pushed && r.mode !== 'existing') });
    var pb = document.getElementById('push');
    if (pb) pb.onclick = function () {
      pb.disabled = true; pb.textContent = 'Pushing…';
      call('/push', { name: r.name, label: 'Figma import' }).then(function (p) {
        var h = '<div class="box ' + (p.ok ? 'ok' : 'bad') + '"><b>' + (p.ok ? 'Pushed to Rive' : 'Push failed') + '</b>' +
          (p.url ? '<br><a href="' + p.url + '" target="_blank">' + p.url + '</a>' : '') + (p.ok ? '' : '<pre>' + esc(p.output) + '</pre>') + '</div>';
        var np = document.getElementById('notPushed'); if (np && p.ok) np.parentNode.removeChild(np);
        out.insertAdjacentHTML('afterbegin', h); pb.textContent = 'Pushed';
        if (p.ok) patchRecent(target ? target.name : r.name, target ? { pushed: true, time: Date.now() } : { pushed: true, time: Date.now(), url: p.url || fileUrl, link: r.mode === 'existing' ? String(r.fileId || '') : '' });
      }).catch(function (er) { out.insertAdjacentHTML('afterbegin', '<div class="box bad">' + esc(er.message) + '</div>'); pb.disabled = false; pb.textContent = 'Try again'; });
    };
    if (pb && optAuto.checked && !prevSnap && !wasUpdate) pb.click(); // an update always waits, so you can read the change report first
  }).catch(function (er) {
    out.innerHTML = '<div class="box bad"><b>Helper not reachable.</b> Start it with <code>Start Helper.command</code>. Zip still works.</div>' + warningsHtml(res) + zipHtml(res, name);
  });
  }
  // Before sending: warn about fonts that are not in the library, and about updating a file that was already pushed.
  var wanted = (res.fonts || []).map(function (f) { return String(f.file).replace(/^fonts\//, ''); });
  var again = !fileId && recents.filter(function (x) { return x.name === name && x.pushed; })[0];
  call('/status').then(function (st) { return st.realFonts || []; }, function () { return null; }).then(function (real) {
    var miss = real ? wanted.filter(function (f) { return real.indexOf(f) < 0; }) : [], msgs = [];
    if (miss.length) msgs.push(cardHtml('Fonts missing', miss.length, '<ul>' + miss.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul><span class="muted">A stand-in font is used.</span>', 'warning'));
    var renamedAb = replacePairs.filter(function (x) { return x.old !== x.new; });
    if (renamedAb.length) msgs.push(cardHtml('Artboard renamed in Rive', renamedAb.length, '<ul>' + renamedAb.map(function (x) { return '<li>' + esc(x.old) + ' \u2192 <b>' + esc(x.new) + '</b></li>'; }).join('') + '</ul><span class="muted">Replaces the old artboard. Edits you made to it in Rive are lost (backup saved).</span>', 'warning'));
    if (again) msgs.push(cardHtml('Already pushed', '', 'This updates the same Rive file.', 'info'));
    var gateKey = fileId ? 'file-' + fileId : name, before = snaps[gateKey];
    if (before) msgs.unshift(changesHtml(diffSnaps(before.map, curSnap), before.time, true));

    out.innerHTML = msgs.join('') + '<div class="actions"><button id="goOn">Send anyway</button><button id="goStop" class="alt">Cancel</button></div>';
    document.getElementById('goOn').onclick = runExport;
    document.getElementById('goStop').onclick = function () { out.innerHTML = ''; };
  });
};
